<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Sound Advisor — Dashboard</title>
<style>
  /* ---- Dark-mode, high-contrast theme (visible in a dim sound booth) ---- */
  :root {
    --bg: #0c0f14;
    --panel: #151a23;
    --panel-edge: #232b38;
    --text: #f2f5fa;
    --muted: #9aa6b8;
    --red: #ff3b30;
    --yellow: #ffcc00;
    --blue: #2e9bff;
    --green: #2ecc71;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--panel-edge);
  }
  header h1 { font-size: 26px; margin: 0; letter-spacing: 0.5px; }
  .status-indicators { display: flex; gap: 18px; }
  .indicator { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }

  main {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    padding: 20px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .panel h2 {
    font-size: 18px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 0 0 14px;
  }

  /* ---- Suggestions panel ---- */
  #suggestions-panel { min-height: 220px; }
  .all-clear {
    font-size: 24px; color: var(--green); text-align: center; padding: 40px 0;
  }
  .suggestion {
    border-left: 6px solid var(--blue);
    background: #1b2130;
    border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .suggestion.prio-critical, .suggestion.prio-high { border-left-color: var(--red); }
  .suggestion.prio-medium { border-left-color: var(--yellow); }
  .suggestion.prio-low { border-left-color: var(--blue); }
  .suggestion .top { display: flex; justify-content: space-between; align-items: center; }
  .suggestion .msg { font-size: 20px; margin: 6px 0 10px; }
  .suggestion .meta { font-size: 15px; color: var(--muted); }
  .badge {
    font-size: 13px; padding: 3px 10px; border-radius: 999px;
    background: #2a3342; color: var(--text); text-transform: uppercase;
  }
  .actions button {
    background: #2a3342; color: var(--text); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 6px 12px; margin-right: 8px; cursor: pointer;
    font-size: 15px;
  }
  .actions button:hover { background: #344056; }

  /* ---- Controls panel ---- */
  .control-group { margin-bottom: 18px; }
  .control-group label { display: block; color: var(--muted); margin-bottom: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    flex: 1; min-width: 90px;
    background: #1b2130; color: var(--text);
    border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 10px; cursor: pointer; font-size: 16px;
  }
  .seg button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- Prompt panel ---- */
  #prompt-panel form { display: flex; gap: 10px; }
  #prompt-input {
    flex: 1; background: #1b2130; color: var(--text);
    border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 12px; font-size: 16px;
  }
  #prompt-panel button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 12px 18px; cursor: pointer; font-size: 16px;
  }
  #prompt-ack { color: var(--green); margin-top: 10px; min-height: 22px; font-size: 15px; }
  .metrics { font-size: 14px; color: var(--muted); margin-top: 6px; }
  #warnings { color: var(--yellow); font-size: 15px; margin-top: 12px; }
</style>
</head>
<body>
  <header>
    <h1>🎚️ AI Sound Advisor</h1>
    <div class="status-indicators">
      <div class="indicator">X32 <span id="x32-dot" class="dot"></span></div>
      <div class="indicator">Audio Input <span id="audio-dot" class="dot"></span></div>
      <div class="indicator">Link <span id="link-dot" class="dot"></span></div>
    </div>
  </header>

  <main>
    <!-- ===== Suggestions Panel ===== -->
    <section class="panel" id="suggestions-panel">
      <h2>Suggestions</h2>
      <div id="suggestions-list">
        <div class="all-clear">✅ Your mix is sounding good</div>
      </div>
      <div id="warnings"></div>
    </section>

    <!-- ===== Controls + Prompt ===== -->
    <div>
      <section class="panel" id="controls-panel" style="margin-bottom:20px;">
        <h2>Controls</h2>
        <div class="control-group">
          <label>Mode</label>
          <div class="seg" id="mode-seg">
            <button data-mode="sermon">Sermon</button>
            <button data-mode="worship">Worship</button>
            <button data-mode="play">Play</button>
          </div>
        </div>
        <div class="control-group">
          <label>Loudness Mode</label>
          <div class="seg" id="loudness-seg">
            <button data-loud="conservative">Conservative</button>
            <button data-loud="balanced">Balanced</button>
            <button data-loud="energetic">Energetic</button>
          </div>
        </div>
        <div class="metrics" id="metrics-line"></div>
      </section>

      <section class="panel" id="prompt-panel">
        <h2>AI Prompt</h2>
        <form id="prompt-form">
          <input id="prompt-input" type="text" autocomplete="off"
                 placeholder='e.g. "The piano is always loud"' />
          <button type="submit">Send</button>
        </form>
        <div id="prompt-ack"></div>
      </section>
    </div>
  </main>

<script>
(function () {
  "use strict";

  // ---- Confidence label from a 0..1 score (mirrors the backend) ----
  function confLabel(c) {
    if (c > 0.8) return "High";
    if (c >= 0.5) return "Medium";
    return "Low";
  }

  function setDot(id, ok) {
    var el = document.getElementById(id);
    el.className = "dot " + (ok ? "ok" : "bad");
  }

  function renderSuggestions(state) {
    var list = document.getElementById("suggestions-list");
    var suggestions = state.suggestions || [];
    if (!suggestions.length) {
      var msg = state.all_clear ? "✅ Your mix is sounding good" : "Monitoring…";
      list.innerHTML = '<div class="all-clear">' + msg + "</div>";
      return;
    }
    list.innerHTML = suggestions.map(function (s) {
      var icon = s.priority_icon || "🔵";
      var label = s.confidence_label
        ? s.confidence_label.charAt(0).toUpperCase() + s.confidence_label.slice(1)
        : confLabel(s.confidence);
      var where = s.channel ? " — " + s.channel : "";
      var channelAttr = s.channel === null || s.channel === undefined ? "" : s.channel;
      return (
        '<div class="suggestion prio-' + s.priority + '">' +
          '<div class="top">' +
            '<span class="badge">' + s.priority + where + "</span>" +
            '<span class="badge">Confidence: ' + label + "</span>" +
          "</div>" +
          '<div class="msg">' + icon + " " + (s.message || s.issue) + "</div>" +
          '<div class="actions">' +
            '<button data-ignore="' + s.issue + '" data-channel="' + channelAttr + '">Ignore (3 min)</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");

    // Wire the Ignore buttons.
    Array.prototype.forEach.call(list.querySelectorAll("[data-ignore]"), function (btn) {
      btn.addEventListener("click", function () {
        var ch = btn.getAttribute("data-channel");
        post("/api/ignore", {
          issue: btn.getAttribute("data-ignore"),
          channel: ch === "" ? null : ch
        });
      });
    });
  }

  function renderControls(state) {
    Array.prototype.forEach.call(document.querySelectorAll("#mode-seg button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-mode") === state.scene);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#loudness-seg button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-loud") === state.loudness_mode);
    });
  }

  function renderMetrics(state) {
    var m = state.metrics;
    var line = document.getElementById("metrics-line");
    if (m) {
      line.textContent =
        "Loudness " + m.loudness_lufs.toFixed(1) + " LUFS · Peak " +
        m.peak_level.toFixed(1) + " dBFS · Low-mid " + m.low_mid_energy +
        " · Highs " + m.high_freq_energy;
    } else {
      line.textContent = "Audio metrics unavailable.";
    }
    var warn = document.getElementById("warnings");
    warn.textContent = (state.warnings || []).join("  ·  ");
  }

  function render(state) {
    if (!state) return;
    setDot("x32-dot", state.mixer_connected);
    setDot("audio-dot", state.audio_ok);
    renderSuggestions(state);
    renderControls(state);
    renderMetrics(state);
  }

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  }

  // ---- Controls wiring ----
  document.querySelectorAll("#mode-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      post("/api/mode", { mode: b.getAttribute("data-mode") });
    });
  });
  document.querySelectorAll("#loudness-seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      post("/api/loudness", { loudness_mode: b.getAttribute("data-loud") });
    });
  });

  // ---- Prompt wiring ----
  document.getElementById("prompt-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("prompt-input");
    var text = input.value.trim();
    if (!text) return;
    post("/api/prompt", { text: text }).then(function (r) { return r.json(); })
      .then(function (res) {
        document.getElementById("prompt-ack").textContent = res.message || "Got it.";
        input.value = "";
      })
      .catch(function () {
        document.getElementById("prompt-ack").textContent = "Could not send.";
      });
  });

  // ---- Real-time updates: WebSocket primary, HTTP polling fallback ----
  var pollTimer = null;

  function startPolling() {
    if (pollTimer) return;
    setDot("link-dot", false);
    pollTimer = setInterval(function () {
      fetch("/api/state").then(function (r) { return r.json(); })
        .then(render).catch(function () {});
    }, 300); // ~3.3 updates/sec
  }

  function startWebSocket() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var ws;
    try {
      ws = new WebSocket(proto + "://" + location.host + "/ws");
    } catch (e) {
      startPolling();
      return;
    }
    ws.onopen = function () {
      setDot("link-dot", true);
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    };
    ws.onmessage = function (ev) {
      try { render(JSON.parse(ev.data)); } catch (e) {}
    };
    ws.onclose = function () { startPolling(); setTimeout(startWebSocket, 2000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  startWebSocket();
})();
</script>
</body>
</html>
